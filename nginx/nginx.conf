upstream django {
    server web:8000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name easymartapi.aqoprojects.com www.easymartapi.aqoprojects.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl http2;
    server_name easymartapi.aqoprojects.com www.easymartapi.aqoprojects.com;

    ssl_certificate /etc/letsencrypt/live/easymartapi.aqoprojects.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easymartapi.aqoprojects.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /static/ {
        proxy_pass https://easymartaqo.s3.amazonaws.com/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass https://easymartaqo.s3.amazonaws.com/media/;
    }

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
