version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: easymart
      POSTGRES_USER: easymart
      POSTGRES_PASSWORD: strongpassword123
    volumes:
      - postgres_data:/var/lib/postgres/data
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck: 
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10


  # rabbitmq:
  #   image: rabbitmq:3-management
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  web:
    build: .
    command: sh -c "uvicorn easymart.asgi:application --host 0.0.0.0 --port 8000 --workers 4"
    volumes:
      - .:/app
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://easymart:strongpassword123@db:5432/easymart
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - CHANNEL_LAYERS_REDIS=redis://redis:6379/1
    # ports:
    #   - "8000:8000"
    depends_on:
      - db 
      - redis
      # - rabbitmq
  
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      - web
    restart: unless-stopped

  celery:
    build: .
    command: celery -A easymart worker --loglevel=info 
    # volumes:
    #   # - static_volume:/var/www/static
    #   # - media_volume:/var/www/media
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      # - DATABASE_URL=postgres://easymart:strongpassword123@db:5432/easymart
      # - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
      # redis:
      #   condition: service_started
      # db:
      #   condition: service_started
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A easymart beat --loglevel=info --schedule=/var/run/celery/celerybeat-schedule
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      # - DATABASE_URL=postgres://easymart:strongpassword123@db:5432/easymart
    #   - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    volumes:
      - celery_beat_data:/var/run/celery
    depends_on:
      rabbitmq:
        condition: service_healthy
      # redis:
      #   condition: service_started    
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
  celery_beat_data: