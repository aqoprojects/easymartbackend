version: '3.9'

services:
  web:
    build: .
    command: uvicorn easymart.asgi:application --host 0.0.0.0 --port 8000 --workers 3
    env_file: .env
    expose:
      - "8000"

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - nginx

  nginx:
    build: ./nginx
    user: root
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
    restart: unless-stopped

networks:
  default:
    name: easymart_network
