version: '3.9'

services:
  web:
    build: .
    command: uvicorn easymart.asgi:application --host 0.0.0.0 --port 8000 --workers 3
    env_file: .env
    expose:
      - "8000"
  
  celery:
    build: .
    command: celery -A easymart worker -l info --concurrency=4
    env_file: .env
    restart: unless-stopped


  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped


networks:
  default:
    name: easymart_network